<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ClarityOKR</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self';
        img-src 'self' data: blob:;
        connect-src 'self' https://api.openai.com https://api.anthropic.com;
        font-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
      "
    />
    <script>
      // Pre-hydration theme sync to prevent flash of un-themed content
      (function () {
        try {
          var stored = localStorage.getItem('clarityokr-theme');
          var theme = 'system';
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            theme = stored;
          }
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          // localStorage may be unavailable in some Electron contexts
        }
      })();
    </script>
  </head>
  <body>
    <clarityokr-root></clarityokr-root>
  </body>
</html>
