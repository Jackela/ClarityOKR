# #44 Release: build the installers when a version tag is pushed and attach them to that tag's
# GitHub Release. This workflow never creates or moves a tag — tags are pushed by a person.
#
# - push of a tag v*            → build macOS / Windows / Linux, attach installers + SHA256SUMS.txt
# - workflow_dispatch (tag)     → same for an existing tag; `upload: false` only builds (dry run)
#
# An existing Release keeps its text: assets are added (same names replaced on a re-run) and an
# "unsigned" note is appended once when no signing certificate was configured. A missing Release
# is created as a draft for the existing tag (--verify-tag: never creates the tag).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.2.0'
        required: true
      upload:
        description: 'Attach the installers to the Release (false = build only)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9'
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Installers (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: --linux
          - os: windows-latest
            platform: win
            target: --win
          - os: macos-latest
            platform: mac
            target: --mac
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: The tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      - name: Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools

      - name: Package
        shell: bash
        env:
          # Signing comes from secrets only; without them the build is unsigned.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unset secret still arrives as an empty string; electron-builder reads an empty
          # CSC_LINK as a path (the repo folder) and fails ("not a file"). Drop empty ones.
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${CSC_LINK:-}${WIN_CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "signed=false" > dist-signing.txt
          else
            echo "signed=true" > dist-signing.txt
          fi
          node scripts/stage-app.mjs
          pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in dist/*.dmg dist/*.exe dist/*.AppImage dist/*.deb; do cp "$f" out/; done
          cp dist-signing.txt "out/signing-${{ matrix.platform }}.txt"
          ls -la out
          test "$(ls out | grep -vc '^signing-')" -gt 0

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the Release
    needs: build
    if: github.event_name == 'push' || github.event.inputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          files=$(ls | grep -v "^signing-")
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload (never touches the tag, keeps the Release text)
        run: |
          signed=true
          grep -q 'signed=false' out/signing-*.txt && signed=false
          rm out/signing-*.txt
          note=$'\n\n---\n> ⚠️ 安装包未签名（macOS 首次打开需右键「打开」；Windows SmartScreen 可能提示）。校验：见 SHA256SUMS.txt。'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            if [ "$signed" = false ]; then
              body="$(gh release view "$TAG" --json body -q .body)"
              case "$body" in
                *安装包未签名*) ;;
                *) gh release edit "$TAG" --notes "${body}${note}" ;;
              esac
            fi
          else
            notes="ClarityOKR ${TAG}"
            [ "$signed" = false ] && notes="${notes}${note}"
            gh release create "$TAG" out/* --verify-tag --draft --title "ClarityOKR ${TAG}" --notes "$notes"
          fi
