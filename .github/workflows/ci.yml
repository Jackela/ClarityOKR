name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E tests (faster CI)'
        required: false
        default: 'false'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  CI: 'true'

jobs:
  build-and-test:
    name: Lint • Typecheck • Unit • Component • Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Ensure pnpm is available (act fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@${PNPM_VERSION}
          fi

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm run build:contracts

      - name: Lint
        run: pnpm run lint
        if: ${{ github.actor != 'nektos/act' || env.ALLOW_LINT == 'true' }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

      - name: Component tests
        run: pnpm run test:component

      - name: Integration tests
        run: pnpm run test:integration

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            app/main/dist
            app/renderer/dist
            packages/contracts/dist
          retention-days: 1

  e2e:
    name: E2E (Playwright + Electron)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_e2e != 'true' }}
    env:
      LLM_API_KEY: test
      LLM_BASE_URL: http://127.0.0.1:7777
      LLM_MODEL: gpt-4o-mini
      ELECTRON_PATH: ./node_modules/.bin/electron
      ELECTRON_EXTRA_LAUNCH_ARGS: --no-sandbox --disable-setuid-sandbox --disable-gpu --disable-dev-shm-usage
      ELECTRON_DISABLE_SANDBOX: 'true'
      ELECTRON_ENABLE_LOGGING: 'true'
      CI_DEBUG_SCREENSHOTS: 'true'
      DEBUG: 'pw:api'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install Playwright browsers + deps
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Electron system deps (act only)
        if: ${{ github.actor == 'nektos/act' }}
        run: |
          apt-get update
          apt-get install -y \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            libdrm2 \
            libgbm1 \
            libxcomposite1 \
            libxrandr2 \
            libxdamage1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libx11-xcb1 \
            libxshmfence1 \
            libcups2 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            xvfb

      - name: Setup Electron sandbox permissions
        run: |
          if command -v sudo >/dev/null 2>&1; then
            SANDBOX_PATH=$(node -p "require('path').join(require('path').dirname(require.resolve('electron')), 'dist', 'chrome-sandbox')") || true
            if [ -f "$SANDBOX_PATH" ]; then
              sudo chown root:root "$SANDBOX_PATH" || true
              sudo chmod 4755 "$SANDBOX_PATH" || true
            fi
          fi

      - name: Run E2E tests
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a -s "-screen 0 1280x800x24" pnpm run test:e2e
          else
            pnpm run test:e2e
          fi

      - name: Upload Playwright traces (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/**/trace.zip
          if-no-files-found: ignore
