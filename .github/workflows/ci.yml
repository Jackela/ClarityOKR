name: CI

on:
  push:
    branches: [ main, "**/*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Electron E2E (Playwright)"
        required: false
        default: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9'
  CI: 'true'

jobs:
  build-and-test:
    name: Lint • Typecheck • Unit • Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Ensure pnpm is available (act fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@${PNPM_VERSION}
          fi
      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        if: ${{ github.actor != 'nektos/act' || env.ALLOW_LINT == 'true' }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        run: pnpm run test:integration

  e2e:
    name: Electron E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    # Run only when manually triggered with input
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true' }}
    env:
      LLM_API_KEY: test
      LLM_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm -w install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install Playwright browsers + deps
        run: |
          npx playwright install --with-deps

      - name: Ensure Xvfb is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run E2E tests (Electron)
        run: |
          xvfb-run -a pnpm --filter @clarityokr/tests-e2e run test

      - name: Upload Playwright traces (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/**/trace.zip
          if-no-files-found: ignore
