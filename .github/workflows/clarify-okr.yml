name: Clarify OKR CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - 'tests/**'
      - 'specs/001-clarify-okr-flow/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      skip_sys_deps:
        description: "Skip Electron system dependencies installation"
        required: false
        default: "false"
      skip_e2e:
        description: "Skip Playwright Electron E2E"
        required: false
        default: "false"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Ensure pnpm is available (act fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@9.0.0
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium
      # Rely on Playwright's install-deps; manual Electron system deps removed for ubuntu-latest compatibility
      - name: Lint
        run: pnpm run lint
        if: ${{ github.actor != 'nektos/act' || env.ALLOW_LINT == 'true' }}
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test:unit
      - name: Component tests
        run: pnpm run test:component
      - name: E2E tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_e2e != 'true' }}
        env:
          ELECTRON_PATH: ./node_modules/.bin/electron
          # Pass extra Chromium args to avoid SUID sandbox failures on ubuntu-latest
          ELECTRON_EXTRA_LAUNCH_ARGS: --no-sandbox --disable-setuid-sandbox
        run: |
          # Ensure Electron chrome-sandbox has proper permissions to satisfy Chromium sandbox if used
          if command -v sudo >/dev/null 2>&1; then
            SANDBOX_PATH=$(node -p "require('path').join(require('path').dirname(require.resolve('electron')), 'dist', 'chrome-sandbox')") || true
            if [ -f "$SANDBOX_PATH" ]; then
              sudo chown root:root "$SANDBOX_PATH" || true
              sudo chmod 4755 "$SANDBOX_PATH" || true
            fi
          fi
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a pnpm run test:e2e
          else
            pnpm run test:e2e
          fi
